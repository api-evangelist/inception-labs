components:
  schemas:
    PricingInfo:
      properties:
        prompt:
          type: string
          title: Prompt
          description: Pricing per 1 token for input.
        completion:
          type: string
          title: Completion
          description: Pricing per 1 token for output.
        input_cache_reads:
          type: string
          title: Input Cache Reads
          description: Pricing per 1 token for cache reads.
          default: '0'
        input_cache_writes:
          type: string
          title: Input Cache Writes
          description: Pricing per 1 token for cache writes.
          default: '0'
      type: object
      required:
      - prompt
      - completion
      title: PricingInfo
      description: Pricing information for a model.
    ModelsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ModelObject'
          type: array
          title: Data
      type: object
      required:
      - data
      title: ModelsResponse
      description: Response model for models endpoint.
      example:
        data:
        - id: mercury-2
          name: 'Inception: Mercury 2'
          created: 1745798400
          description: Mercury 2 diffusion language model for chat completions.
          input_modalities:
          - text
          output_modalities:
          - text
          context_length: 128000
          max_output_length: 50000
          pricing:
            prompt: '0.00000025'
            completion: '0.00000075'
            input_cache_reads: '0.000000025'
            input_cache_writes: '0'
          supported_sampling_parameters:
          - temperature
          - stop
          supported_features:
          - tools
          - json_mode
          - structured_outputs
          openrouter:
            slug: inception/mercury-2
          datacenters:
          - country_code: US
    OpenRouterInfo:
      properties:
        slug:
          type: string
          title: Slug
          description: OpenRouter slug for the model.
      type: object
      required:
      - slug
      title: OpenRouterInfo
      description: Optional OpenRouter-specific information.
    ErrorResponse:
      type: object
      title: ErrorResponse
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
      example:
        error:
          message: You exceeded the maximum context length for this model of 128000. Please reduce the length of the messages or completion.
          type: invalid_request_error
          param: messages
          code: context_length_exceeded
    ModelObject:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the model.
        name:
          type: string
          title: Name
          description: Display name for the model.
        created:
          type: integer
          title: Created
          description: Unix timestamp when model was created.
        input_modalities:
          items:
            type: string
          type: array
          title: Input Modalities
          description: Supported input modalities.
        output_modalities:
          items:
            type: string
          type: array
          title: Output Modalities
          description: Supported output modalities.
        context_length:
          type: integer
          title: Context Length
          description: Maximum context length in tokens.
        max_output_length:
          type: integer
          title: Max Output Length
          description: Maximum output length in tokens.
        pricing:
          $ref: '#/components/schemas/PricingInfo'
          description: Pricing information.
        supported_sampling_parameters:
          items:
            type: string
          type: array
          title: Supported Sampling Parameters
          description: Supported sampling parameters.
        supported_features:
          items:
            type: string
          type: array
          title: Supported Features
          description: Supported model features.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Model description.
        openrouter:
          anyOf:
          - $ref: '#/components/schemas/OpenRouterInfo'
          - type: 'null'
          description: OpenRouter-specific metadata.
        datacenters:
          anyOf:
          - items:
              $ref: '#/components/schemas/DataCenter'
            type: array
          - type: 'null'
          title: Datacenters
          description: Available datacenters.
      type: object
      required:
      - id
      - name
      - created
      - input_modalities
      - output_modalities
      - context_length
      - max_output_length
      - pricing
      - supported_sampling_parameters
      - supported_features
      title: ModelObject
      description: Model information object.
    DataCenter:
      properties:
        country_code:
          type: string
          title: Country Code
          description: ISO 3166 Alpha-2 country code.
      type: object
      required:
      - country_code
      title: DataCenter
      description: Datacenter location information.
    ErrorObject:
      type: object
      title: ErrorObject
      required:
      - message
      - type
      properties:
        message:
          type: string
          description: Human-readable error message.
        type:
          type: string
          description: Error category, e.g. `invalid_request_error`, `rate_limit_error`.
        param:
          type:
          - string
          - 'null'
          description: Offending parameter, if applicable.
        code:
          type:
          - string
          - 'null'
          description: Machine-readable error code.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key provided as a Bearer token: `Authorization: Bearer <api_key>`. Get an API key at https://platform.inceptionlabs.ai.'
