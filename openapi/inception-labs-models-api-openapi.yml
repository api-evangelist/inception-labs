                  pricing:
                    prompt: '0.00000025'
                    completion: '0.00000075'
                    input_cache_reads: '0.000000025'
                    input_cache_writes: '0'
                  supported_sampling_parameters:
                  - temperature
                  - stop
                  supported_features:
                  - tools
                  - json_mode
                  - structured_outputs
                  openrouter:
                    slug: inception/mercury-2
