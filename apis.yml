aid: inception-labs
name: Inception Labs
description: >-
  Inception Labs builds Mercury, the first family of commercial-scale diffusion
  large language models (dLLMs) that generate tokens in parallel for 5-10x faster
  inference than comparable speed-optimized models. The Inception API is an
  OpenAI-compatible REST interface exposing Mercury 2 (a 128K-context reasoning
  dLLM) and Mercury Edit 2 (a coding-focused model) through chat,
  fill-in-the-middle, and code-edit completion endpoints, with server-sent-event
  streaming, tool calling, structured JSON-schema outputs, and an "instant"
  low-latency reasoning mode for realtime voice. Founded in 2024 by Stanford
  professor Stefano Ermon, the company is backed by Mayfield and ships official
  Python and TypeScript client libraries plus AWS Bedrock and Azure Foundry
  enterprise deployment.
